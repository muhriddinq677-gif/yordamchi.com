<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yordamchi.com - Dev Tools</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 16px; font-weight: 600; cursor: pointer; padding: 5px 10px; transition: 0.3s; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; margin-bottom: -12px; }
        .panel { display: none; }
        .panel.active { display: block; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        input[type="number"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #0ea5e9; }
        .result-box { margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; min-height: 50px; word-break: break-all; white-space: pre-line; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dasturchi Vositalari</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pwd-panel', this)">Parol Generator</button>
        <button class="tab-btn" onclick="switchTab('lorem-panel', this)">Lorem Ipsum</button>
    </div>

    <!-- Parol Generator Paneli -->
    <div id="pwd-panel" class="panel active">
        <div class="group">
            <label>Parol uzunligi:</label>
            <input type="number" id="pwd-length" value="12" min="6" max="30">
        </div>
        <button class="btn" onclick="generatePassword()">Parol Yaratish</button>
        <div class="result-box" id="pwd-output">Bu yerda parol ko'rinadi...</div>
    </div>

    <!-- Lorem Ipsum Paneli -->
    <div id="lorem-panel" class="panel">
        <div class="group">
            <label>Paragraflar soni:</label>
            <input type="number" id="lorem-count" value="2" min="1" max="10">
        </div>
        <button class="btn" onclick="generateLorem()">Matn Yaratish</button>
        <div class="result-box" id="lorem-output">Bu yerda matn ko'rinadi...</div>
    </div>
</div>

<script>
    function switchTab(panelId, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
        btn.classList.add('active');
    }

    function generatePassword() {
        const length = document.getElementById('pwd-length').value;
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
        let password = "";
        for (let i = 0; i < length; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('pwd-output').innerText = password;
    }

    function generateLorem() {
        const count = document.getElementById('lorem-count').value;
        const dummyText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
        let result = "";
        for(let i=0; i<count; i++) {
            result += dummyText + "\n\n";
        }
        document.getElementById('lorem-output').innerText = result.trim();
    }
</script>

</body>
</html>
