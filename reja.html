<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yordamchi.com - Todo List (Checkbox bilan)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .todo-container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); margin-top: 40px; }
        h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; font-size: 24px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-size: 16px; }
        input[type="text"]:focus { border-color: #38bdf8; }
        .add-btn { padding: 12px 20px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .add-btn:hover { background: #0ea5e9; }
        .todo-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; transition: 0.2s; }
        .todo-item.completed { border-color: #10b981; }
        .todo-left { display: flex; align-items: center; gap: 12px; flex: 1; margin-right: 10px; }
        
        /* Chiroyli Checkbox Custom uslubi */
        input[type="checkbox"] { 
            width: 18px; 
            height: 18px; 
            cursor: pointer; 
            accent-color: #10b981; /* Ptichka rangi yashil bo'ladi */
        }
        
        .todo-text { cursor: pointer; word-break: break-all; font-size: 16px; transition: 0.2s; }
        .todo-item.completed .todo-text { text-decoration: line-through; color: #64748b; }
        
        .delete-btn { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        .empty-text { text-align: center; color: #64748b; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

<div class="todo-container">
    <h2>Kunlik Vazifalar</h2>
    
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="Yangi vazifa qo'shing..." onkeypress="handleKeyPress(event)">
        <button class="add-btn" onclick="addTodo()">Qo'shish</button>
    </div>

    <ul class="todo-list" id="todo-list">
        <!-- Vazifalar JS orqali shu yerga yuklanadi -->
    </ul>
    <div id="empty-msg" class="empty-text">Hozircha vazifalar yo'q</div>
</div>

<script>
    // Brauzer xotirasidan vazifalarni yuklab olish
    let todos = JSON.parse(localStorage.getItem('yordamchi_todos')) || [];

    // Sahifa ochilganda render qilish
    document.addEventListener('DOMContentLoaded', renderTodos);

    function renderTodos() {
        const list = document.getElementById('todo-list');
        const emptyMsg = document.getElementById('empty-msg');
        list.innerHTML = '';

        if (todos.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        } else {
            emptyMsg.style.display = 'none';
        }

        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            
            li.innerHTML = `
                <div class="todo-left">
                    <input type="checkbox" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(${index})">
                    <span class="todo-text" onclick="toggleTodo(${index})">${todo.text}</span>
                </div>
                <button class="delete-btn" onclick="deleteTodo(${index})">O'chirish</button>
            `;
            list.appendChild(li);
        });
    }

    function addTodo() {
        const input = document.getElementById('todo-input');
        const text = input.value.trim();
        
        if (text === '') return;

        todos.push({ text: text, completed: false });
        saveAndRender();
        input.value = '';
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            addTodo();
        }
    }

    // Ptichka bosilganda holatni o'zgartirish
    function toggleTodo(index) {
        todos[index].completed = !todos[index].completed;
        saveAndRender();
    }

    // Vazifani o'chirish
    function deleteTodo(index) {
        todos.splice(index, 1);
        saveAndRender();
    }

    // Ma'lumotlarni saqlash va yangilash
    function saveAndRender() {
        localStorage.setItem('yordamchi_todos', JSON.stringify(todos));
        renderTodos();
    }
</script>

</body>
</html>
